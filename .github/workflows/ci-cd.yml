name: Deploy to AWS S3 (Academy)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  AWS_REGION: us-east-1                  # Academy는 us-east-1 / us-west-1만 허용
  S3_BUCKET: mybucket--20263627          # 자신의 버킷 이름으로 수정

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

      - name: Build (Vite)
        run: npm run build              # 결과물: dist/

      # ---------- 아래부터는 main 브랜치 푸시일 때만 실행 ----------
      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}   # Academy 임시 자격증명에 필수
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy dist/ to S3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          aws s3 sync ./dist "s3://${{ env.S3_BUCKET }}" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"
          # index.html은 캐시되면 새 버전이 반영 안 되므로 짧게
          aws s3 cp ./dist/index.html "s3://${{ env.S3_BUCKET }}/index.html" \
            --cache-control "public, max-age=0, must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Print site URL
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "🚀 http://${{ env.S3_BUCKET }}.s3-website-${{ env.AWS_REGION }}.amazonaws.com"
